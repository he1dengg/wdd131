<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asunción Paraguay Temple Album</title>
    <meta name="description" content="A responsive picture album showcasing beautiful views of the Asunción Paraguay Temple.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 768px)">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <button id="menu" aria-label="Toggle Menu"></button>
        <nav>
            <ul class="navigation">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Asunción Paraguay Temple</h2>
        <div class="gallery">
            <figure>
                <img src="images/Asunción Paraguay Temple.jpeg" alt="Asunción Paraguay Temple exterior front view" loading="lazy">
                <figcaption>Asunción Paraguay Temple</figcaption>
            </figure>
            <figure>
                <img src="images/Asunción Paraguay Temple at Daytime.jpeg" alt="Asunción Paraguay Temple daytime side angle" loading="lazy">
                <figcaption>Asunción Paraguay Temple at Daytime</figcaption>
            </figure>
            <figure>
                <img src="images/Asunción Paraguay Temple Entrance.jpeg" alt="Asunción Paraguay Temple illuminated at night" loading="lazy">
                <figcaption>Asunción Paraguay Temple Entrance</figcaption>
            </figure>
            <figure>
                <img src="images/The Asunción Paraguay Temple at Night.jpeg" alt="Asunción Paraguay Temple front entrance gates" loading="lazy">
                <figcaption>The Asunción Paraguay Temple at Night</figcaption>
            </figure>
            <figure>
                <img src="images/Asunción Temple Beautiful Gardens.jpeg" alt="Asunción Paraguay Temple wide angle garden view" loading="lazy">
                <figcaption>Asunción Temple Beautiful Gardens</figcaption>
            </figure>
            <figure>
                <img src="images/Asunción Temple Spire.jpeg" alt="Asunción Paraguay Temple spire pointing to the sky" loading="lazy">
                <figcaption>Asunción Temple Spire</figcaption>
            </figure>
            <figure>
                <img src="images/sunción Temple at Sunset.jpeg" alt="Asunción Paraguay Temple sunset view" loading="lazy">
                <figcaption>Asunción Temple at Sunset</figcaption>
            </figure>
            <figure>
                <img src="images/Asunción Temple Architecture.jpeg" alt="Asunción Paraguay Temple detailed architecture close-up" loading="lazy">
                <figcaption>Asunción Temple Architecture</figcaption>
            </figure>
            <figure>
                <img src="images/Asunción Temple Landscape.jpeg" alt="Asunción Paraguay Temple aerial landscape view" loading="lazy">
                <figcaption>Asunción Temple Landscape</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Hai Dang Nguyen | Miramichi, New Brunswick, Canada</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
