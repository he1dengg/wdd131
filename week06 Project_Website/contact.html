<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Apex Architecture to start your next visionary project.">
    <meta name="author" content="WDD 131 Student">
    <title>Apex Architecture | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header>
        <h1>Apex Architecture</h1>
        <button id="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="gallery.html">Projects</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>
    <main>
        <h2 class="page-title">Let's Build Together</h2>
        <div id="welcome-message"></div>
        <form id="contact-form" class="card">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="message">Project Details</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </main>
    <footer>
        <p>&copy; <span id="year"></span> Apex Architecture</p>
        <p>Last Modified: <span id="last-modified"></span></p>
        <a href="references.html">References</a>
    </footer>
</body>
</html>
