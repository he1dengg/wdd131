<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is a product review form for the WDD 131 assignment.">
    <meta name="author" content="he1dengg">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles.css">
    <script src="form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Review Details</legend>
                
                <label for="productName">Product Name:</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <label>Overall Rating:</label>
                <div class="rating">
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">☆</label>
                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2">☆</label>
                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3">☆</label>
                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4">☆</label>
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">☆</label>
                </div>

                <label for="installDate">Date of Installation:</label>
                <input type="date" id="installDate" name="installDate" required>

                <label>Useful Features:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="feature1" name="features" value="Design">
                    <label for="feature1">Design</label>
                    <input type="checkbox" id="feature2" name="features" value="Performance">
                    <label for="feature2">Performance</label>
                    <input type="checkbox" id="feature3" name="features" value="EaseOfUse">
                    <label for="feature3">Ease of Use</label>
                    <input type="checkbox" id="feature4" name="features" value="Durability">
                    <label for="feature4">Durability</label>
                </div>

                <label for="reviewText">Written Review:</label>
                <textarea id="reviewText" name="reviewText" rows="4"></textarea>

                <label for="userName">User Name:</label>
                <input type="text" id="userName" name="userName">

                <input type="submit" value="Submit Review">
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 he1dengg</p>
    </footer>
</body>
</html>
